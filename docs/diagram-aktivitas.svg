<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1500" viewBox="0 0 1660 1500" role="img" aria-labelledby="title description">
  <title id="title">Diagram Aktivitas ALTERIA</title>
  <desc id="description">Diagram UML alur publik, daftar, masuk, validasi, penentuan peran, verifikasi Kurator, aktivitas peran, dan keluar dari akun di ALTERIA.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 Z" fill="#505b4c" />
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #252921; }
    .page-title { font-family: "Noto Serif", Georgia, serif; font-size: 48px; font-weight: 600; }
    .subtitle { font-size: 20px; fill: #4b5448; }
    .action, .decision, .merge { stroke: #64715f; stroke-width: 1.8; }
    .action { fill: #fffdf6; }
    .decision, .merge { fill: #e8eddf; }
    .error-action { fill: #f7ece3; stroke: #8e6454; }
    .role-action { fill: #f9faf3; }
    .action-title { font-size: 21px; font-weight: 650; }
    .decision-title { font-size: 19px; font-weight: 650; }
    .detail { font-size: 17px; fill: #3e493b; }
    .guard { font-size: 17px; font-weight: 600; fill: #40533e; }
    .error-guard { fill: #784f42; }
    .flow { fill: none; stroke: #505b4c; stroke-width: 1.9; stroke-linejoin: round; marker-end: url(#arrow); }
    .terminal { fill: #344333; }
  </style>
  <rect width="1660" height="1500" fill="#f6f3ea" />
  <text class="page-title" x="50" y="62">Diagram Aktivitas ALTERIA</text>
  <text class="subtitle" x="50" y="96">Alur kunjungan yang dimulai dari beranda sebagai tamu</text>
  <path d="M 50,113 H 1610" stroke="#d9d6c9" stroke-width="1.4" />

  <circle id="start" class="terminal" cx="830" cy="139" r="10" />
  <path id="start-to-home" class="flow" d="M 830,149 V 163" />
  <path id="home-to-access" class="flow" d="M 830,227 V 259" />
  <path id="access-to-public" class="flow" d="M 704,296 H 233 V 365" />
  <path id="access-to-register" class="flow" d="M 830,333 V 347 H 720 V 365" />
  <path id="access-to-login" class="flow" d="M 956,296 H 1250 V 365" />
  <path id="public-to-end" class="flow" d="M 233,439 V 506" />
  <path id="register-to-validation" class="flow" d="M 720,439 V 482" />
  <path id="login-to-validation" class="flow" d="M 1250,439 V 482" />
  <path id="signup-invalid" class="flow" d="M 585,520 H 476 V 503" />
  <path id="retry-signup" class="flow" d="M 476,439 V 402 H 560" />
  <path id="login-invalid" class="flow" d="M 1385,520 H 1500 V 503" />
  <path id="retry-login" class="flow" d="M 1500,439 V 402 H 1410" />
  <path id="signup-valid" class="flow" d="M 720,558 V 596" />
  <path id="login-valid" class="flow" d="M 1250,558 V 596" />
  <path id="signup-to-merge" class="flow" d="M 720,656 V 703 H 816" />
  <path id="login-to-merge" class="flow" d="M 1250,656 V 703 H 844" />
  <path id="session-to-role" class="flow" d="M 830,717 V 750" />
  <path id="role-to-member" class="flow" d="M 693,790 H 233 V 952" />
  <path id="role-to-curator" class="flow" d="M 830,830 V 860" />
  <path id="role-to-admin" class="flow" d="M 967,790 H 1427 V 952" />
  <path id="curator-status" class="flow" d="M 693,898 H 615 V 952" />
  <path id="curator-approved" class="flow" d="M 967,898 H 1055 V 952" />
  <path id="pending-to-merge" class="flow" d="M 615,1112 V 1156 H 816" />
  <path id="curator-to-merge" class="flow" d="M 1055,1112 V 1156 H 844" />
  <path id="curator-to-activity-merge" class="flow" d="M 830,1170 V 1205" />
  <path id="member-to-activity-merge" class="flow" d="M 233,1112 V 1219 H 816" />
  <path id="admin-to-activity-merge" class="flow" d="M 1427,1112 V 1219 H 844" />
  <path id="activity-to-signout" class="flow" d="M 830,1233 V 1254" />
  <path id="signout-to-login" class="flow" d="M 830,1314 V 1340" />
  <path id="login-to-end" class="flow" d="M 830,1404 V 1437" />
  <g id="open-home">
    <rect class="action " x="655" y="163" width="350" height="64" rx="14" />
    <text class="action-title" x="830" y="202" text-anchor="middle">Buka beranda ALTERIA</text>
  </g>
  <g id="choose-access">
    <polygon class="decision" points="830,259 956,296 830,333 704,296" />
    <text class="decision-title" x="830" y="303" text-anchor="middle">Pilih akses</text>
  </g>
    <text class="guard" x="460" y="283" text-anchor="middle">[Jelajahi]</text>
    <text class="guard" x="757" y="337" text-anchor="middle">[Daftar]</text>
    <text class="guard" x="1107" y="283" text-anchor="middle">[Masuk]</text>
  <g id="public-pages">
    <rect class="action " x="58" y="365" width="350" height="74" rx="14" />
    <text class="action-title" x="233" y="397" text-anchor="middle">Jelajahi halaman publik</text>
    <text class="detail" x="233" y="424" text-anchor="middle">Galeri, karya, kreator, dan challenge</text>
  </g>
  <g id="register-form">
    <rect class="action " x="560" y="365" width="320" height="74" rx="14" />
    <text class="action-title" x="720" y="397" text-anchor="middle">Isi formulir pendaftaran</text>
    <text class="detail" x="720" y="424" text-anchor="middle">Pilih Member atau Kurator</text>
  </g>
  <g id="login-form">
    <rect class="action " x="1090" y="365" width="320" height="74" rx="14" />
    <text class="action-title" x="1250" y="409" text-anchor="middle">Isi email dan kata sandi</text>
  </g>
    <text class="detail" x="214" y="481" text-anchor="end">Akhiri kunjungan</text>
  <g id="public-end">
    <circle cx="233" cy="520" r="14" fill="#f6f3ea" stroke="#344333" stroke-width="2" />
    <circle cx="233" cy="520" r="9" class="terminal" />
  </g>
  <g id="register-error">
    <rect class="action error-action" x="399" y="439" width="154" height="64" rx="14" />
    <text class="action-title" x="476" y="468" text-anchor="middle">Tampilkan</text>
    <text class="action-title" x="476" y="491" text-anchor="middle">pesan error</text>
  </g>
  <g id="login-error">
    <rect class="action error-action" x="1423" y="439" width="154" height="64" rx="14" />
    <text class="action-title" x="1500" y="468" text-anchor="middle">Tampilkan</text>
    <text class="action-title" x="1500" y="491" text-anchor="middle">pesan error</text>
  </g>
  <g id="validate-registration">
    <polygon class="decision" points="720,482 855,520 720,558 585,520" />
    <text class="decision-title" x="720" y="518" text-anchor="middle">Data pendaftaran</text>
    <text class="decision-title" x="720" y="538" text-anchor="middle">valid?</text>
  </g>
  <g id="validate-login">
    <polygon class="decision" points="1250,482 1385,520 1250,558 1115,520" />
    <text class="decision-title" x="1250" y="518" text-anchor="middle">Email dan kata sandi</text>
    <text class="decision-title" x="1250" y="538" text-anchor="middle">cocok?</text>
  </g>
    <text class="guard error-guard" x="530" y="544" text-anchor="middle">[Tidak]</text>
    <text class="guard error-guard" x="1445" y="544" text-anchor="middle">[Tidak]</text>
    <text class="guard" x="735" y="582" text-anchor="start">[Ya]</text>
    <text class="guard" x="1265" y="582" text-anchor="start">[Ya]</text>
  <g id="register-session">
    <rect class="action " x="560" y="596" width="320" height="60" rx="14" />
    <text class="action-title" x="720" y="633" text-anchor="middle">Simpan akun dan buat sesi</text>
  </g>
  <g id="login-session">
    <rect class="action " x="1090" y="596" width="320" height="60" rx="14" />
    <text class="action-title" x="1250" y="633" text-anchor="middle">Buat sesi</text>
  </g>
  <g id="successful-session">
    <polygon class="merge" points="830,689 844,703 830,717 816,703" />
  </g>
  <g id="read-role">
    <polygon class="decision" points="830,750 967,790 830,830 693,790" />
    <text class="decision-title" x="830" y="797" text-anchor="middle">Peran akun?</text>
  </g>
    <text class="guard" x="460" y="777" text-anchor="middle">[Member]</text>
    <text class="guard" x="847" y="851" text-anchor="start">[Kurator]</text>
    <text class="guard" x="1205" y="777" text-anchor="middle">[Admin]</text>
  <g id="check-curator-status">
    <polygon class="decision" points="830,860 967,898 830,936 693,898" />
    <text class="decision-title" x="830" y="896" text-anchor="middle">Status verifikasi</text>
    <text class="decision-title" x="830" y="916" text-anchor="middle">Kurator?</text>
  </g>
    <text class="guard" x="610" y="885" text-anchor="middle">[Menunggu atau ditolak]</text>
    <text class="guard" x="1050" y="885" text-anchor="middle">[Disetujui]</text>
  <g id="member-activities">
    <rect class="action role-action" x="50" y="952" width="366" height="160" rx="14" />
    <text class="action-title" x="233" y="991" text-anchor="middle">Pilih aktivitas Member</text>
    <text class="detail" x="233" y="1018" text-anchor="middle">Kelola karya, profil, atau akun</text>
    <text class="detail" x="233" y="1041" text-anchor="middle">Sukai, komentari, atau simpan karya</text>
    <text class="detail" x="233" y="1064" text-anchor="middle">Laporkan karya</text>
    <text class="detail" x="233" y="1087" text-anchor="middle">Kirim atau tarik submisi challenge</text>
  </g>
  <g id="curator-status-page">
    <rect class="action role-action" x="460" y="952" width="310" height="160" rx="14" />
    <text class="action-title" x="615" y="1027" text-anchor="middle">Lihat status verifikasi</text>
    <text class="detail" x="615" y="1054" text-anchor="middle">Menunggu keputusan atau ditolak</text>
  </g>
  <g id="curator-activities">
    <rect class="action role-action" x="900" y="952" width="310" height="160" rx="14" />
    <text class="action-title" x="1055" y="1003" text-anchor="middle">Pilih aktivitas Kurator</text>
    <text class="detail" x="1055" y="1030" text-anchor="middle">Buat atau kelola challenge sendiri</text>
    <text class="detail" x="1055" y="1053" text-anchor="middle">Tinjau submisi peserta</text>
    <text class="detail" x="1055" y="1076" text-anchor="middle">Umumkan pemenang usai tenggat</text>
  </g>
  <g id="admin-activities">
    <rect class="action role-action" x="1244" y="952" width="366" height="160" rx="14" />
    <text class="action-title" x="1427" y="1003" text-anchor="middle">Pilih aktivitas Admin</text>
    <text class="detail" x="1427" y="1030" text-anchor="middle">Lihat statistik atau kelola pengguna</text>
    <text class="detail" x="1427" y="1053" text-anchor="middle">Setujui atau tolak pendaftaran Kurator</text>
    <text class="detail" x="1427" y="1076" text-anchor="middle">Kelola kategori atau moderasi laporan</text>
  </g>
  <g id="merge-curator-routes">
    <polygon class="merge" points="830,1142 844,1156 830,1170 816,1156" />
  </g>
  <g id="merge-role-routes">
    <polygon class="merge" points="830,1205 844,1219 830,1233 816,1219" />
  </g>
  <g id="sign-out">
    <rect class="action " x="662.5" y="1254" width="335" height="60" rx="14" />
    <text class="action-title" x="830" y="1291" text-anchor="middle">Pilih Keluar</text>
  </g>
  <g id="clear-session">
    <rect class="action " x="586" y="1340" width="488" height="64" rx="14" />
    <text class="action-title" x="830" y="1379" text-anchor="middle">Hapus sesi dan tampilkan halaman Masuk</text>
  </g>
  <g id="signed-end">
    <circle cx="830" cy="1451" r="14" fill="#f6f3ea" stroke="#344333" stroke-width="2" />
    <circle cx="830" cy="1451" r="9" class="terminal" />
  </g>
</svg>
